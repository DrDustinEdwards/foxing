<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Foxing Reader</title>
  <style>
    /* The body is the canvas; foliate-view fills it. The host (React Native)
       overrides background/color via applyTheme(). */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #1a1a1a;
      color: #ffffff;
      font-family: -apple-system, system-ui, sans-serif;
      /* OS selection is suppressed at the host level too — defense in depth.
         Real selection suppression happens inside each chapter iframe via
         the CSS we inject in applyThemeNow(). */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    foliate-view {
      display: block;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div id="loading">Preparing reader…</div>

  <script type="module">
    // ─────────────────────────────────────────────────────────────────────
    // Bridge: messages flow as JSON over RNWebView's postMessage. Inbound
    // calls from the RN host arrive via window.foliateBridge.* (see bottom)
    // which the host invokes through injectJavaScript.
    //
    // OUTBOUND messages — every type:
    //   { type: 'ready' }                    bridge harness loaded
    //   { type: 'opened', metadata }         book parsed, first page rendered
    //   { type: 'error', message }           any caught error
    //   { type: 'locationChange', cfi, fraction, tocLabel, pageWordCount }
    //                                        relocate event from foliate
    //   { type: 'tap' }                      tap on empty area (chrome toggle)
    //   { type: 'wordTapped', word, cfi, surroundingText, rect }
    //                                        tap on a word — open word pill
    //   { type: 'passageSelected', text, cfi, rect }
    //                                        long-press + drag — open passage pill
    //   { type: 'pillDismiss' }              user tapped outside an active pill
    // ─────────────────────────────────────────────────────────────────────

    const post = (msg) => {
      try { window.ReactNativeWebView?.postMessage(JSON.stringify(msg)) }
      catch (e) { console.error('postMessage failed:', e) }
    }

    window.addEventListener('error', (e) => {
      post({ type: 'error', message: e.message || 'unknown script error' })
    })
    window.addEventListener('unhandledrejection', (e) => {
      const m = e.reason?.message || String(e.reason || 'unhandled rejection')
      post({ type: 'error', message: m })
    })

    await import('./view.js')

    let view = null

    // ─────────────────────────────────────────────────────────────────────
    // EPUB load
    // ─────────────────────────────────────────────────────────────────────

    function base64ToBlob(b64, mimeType) {
      const byteChars = atob(b64)
      const bytes = new Uint8Array(byteChars.length)
      for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i)
      return new Blob([bytes], { type: mimeType })
    }

    async function openBookFromBase64(base64, mime = 'application/epub+zip') {
      const blob = base64ToBlob(base64, mime)
      const file = new File([blob], 'book.epub', { type: mime })

      view = document.createElement('foliate-view')
      document.body.append(view)

      view.addEventListener('load', (e) => {
        const { doc, index } = e.detail
        _currentIndex = index
        wireDocumentEvents(doc)
        // Re-apply the per-section CSS (selection suppression + theme) every
        // time a new chapter mounts — the iframe's stylesheet is fresh per
        // chapter, so the inject from openBook only covered the first one.
        if (currentTheme) applyChapterCSS(doc, currentTheme)
        // Margin dots also vanish when a chapter remounts — re-paint from
        // the cached list so the user sees them on every chapter.
        if (passageComments.length > 0) paintCommentDotsInDoc(doc)
        if (popularHighlights.length > 0) paintPopularLabelsInDoc(doc)
        // Focus mode — update the focused paragraph on load and on every
        // subsequent scroll inside the iframe.
        const focusOn = !!currentTheme?.focusMode
        updateFocusedParagraph(doc, focusOn)
        if (focusOn) {
          try {
            doc.defaultView?.addEventListener?.('scroll', () => updateFocusedParagraph(doc, true), { passive: true })
          } catch {}
        }
      })
      view.addEventListener('relocate', (e) => {
        const { fraction, cfi, tocItem } = e.detail
        const sample = readVisiblePage()
        post({
          type: 'locationChange',
          cfi: cfi ?? null,
          fraction: typeof fraction === 'number' ? fraction : 0,
          tocLabel: tocItem?.label || null,
          pageWordCount: sample.wordCount,
          pageText: sample.text,
        })
      })

      try { await view.open(file) }
      catch (e) {
        post({ type: 'error', message: e?.message || 'open failed' })
        return
      }

      const splash = document.getElementById('loading')
      if (splash) splash.remove()

      if (pendingTheme) {
        applyThemeNow(pendingTheme)
        pendingTheme = null
      }

      view.renderer.next()

      const meta = view.book?.metadata ?? {}
      post({
        type: 'opened',
        metadata: {
          title: typeof meta.title === 'string' ? meta.title : null,
          author: Array.isArray(meta.author)
            ? meta.author.map((a) => typeof a === 'string' ? a : a?.name).filter(Boolean).join(', ')
            : (typeof meta.author === 'string' ? meta.author : null),
        },
      })
    }

    let _currentIndex = 0
    function currentIndex() { return _currentIndex }

    // Reads the visible iframe doc body and returns both a word-count
    // (used by the host's WPM tracker) and a truncated text sample (used
    // by the Word Wise hint fetch). Truncation cap of 4000 chars matches
    // the Edge Function's `wordWise` handler so we don't ship more than
    // it'll keep.
    function readVisiblePage() {
      try {
        const contents = view?.renderer?.getContents?.() ?? []
        const visible = contents.find((c) => c.index === _currentIndex)
        if (!visible?.doc) return { wordCount: 0, text: '' }
        const text = (visible.doc.body?.innerText ?? '').trim()
        const wordCount = text.split(/\s+/).filter(Boolean).length
        return { wordCount, text: text.slice(0, 4000) }
      } catch {
        return { wordCount: 0, text: '' }
      }
    }

    // ─────────────────────────────────────────────────────────────────────
    // Theme + selection-suppression CSS
    // ─────────────────────────────────────────────────────────────────────

    let pendingTheme = null
    let currentTheme = null

    function chapterCSS(theme) {
      const {
        background, text, fontSize, lineHeight, fontFamily, bold,
        paragraphSpacing, marginPx, justify,
        letterSpacingEm, firstLineIndent, dropCap, focusMode,
      } = theme
      // user-select:none + -webkit-touch-callout:none collectively suppress
      // the OS selection handles AND the long-press context menu inside
      // every chapter iframe. Custom tap detection (caretRangeFromPoint)
      // happens regardless of whether the OS sees a selection.
      return `
        @namespace epub "http://www.idpf.org/2007/ops";
        html { color-scheme: ${isDarkColor(background) ? 'dark' : 'light'}; }
        html, body, p, li, blockquote, dd, span, div {
          -webkit-user-select: none !important;
          user-select: none !important;
          -webkit-touch-callout: none !important;
        }
        body {
          background: ${background} !important;
          color: ${text} !important;
          font-family: ${fontFamily || 'Source Serif 4, Georgia, serif'} !important;
          font-size: ${fontSize}px !important;
          line-height: ${lineHeight} !important;
          font-weight: ${bold ? 600 : 400} !important;
          padding: ${marginPx ?? 16}px !important;
          letter-spacing: ${typeof letterSpacingEm === 'number' ? letterSpacingEm + 'em' : '0'} !important;
        }
        p, li, blockquote, dd, span, div { color: ${text} !important; }
        p { margin-top: ${paragraphSpacing ?? 0.6}em !important; margin-bottom: ${paragraphSpacing ?? 0.6}em !important; }
        ${firstLineIndent ? `p { text-indent: 1.5em !important; }` : ''}
        ${dropCap
          ? `/* drop cap: large stylized first letter on the first paragraph of each chapter */
             body > p:first-of-type::first-letter,
             body > div:first-of-type p:first-of-type::first-letter {
               float: left;
               font-size: 3.4em;
               line-height: 0.9;
               padding-right: 8px;
               padding-top: 2px;
               font-weight: 600;
             }`
          : ''}
        ${focusMode
          ? `/* focus mode dims all paragraphs; JS adds .foxing-focused to the
               paragraph at the viewport center on every scroll/relocate. */
             p, li, blockquote, dd { opacity: 0.35; transition: opacity 200ms ease; }
             p.foxing-focused, li.foxing-focused, blockquote.foxing-focused, dd.foxing-focused {
               opacity: 1 !important;
             }`
          : ''}
        /* TTS active-sentence underline */
        .foxing-tts-current { background: rgba(245,196,96,0.35); border-radius: 2px; padding: 0 2px; }
        ${justify === false
          ? `p, li, blockquote, dd { text-align: start !important; }`
          : `p, li, blockquote, dd { text-align: justify !important; }`
        }
        a:link { color: lightblue; }
        pre { white-space: pre-wrap !important; }
        aside[epub|type~="endnote"],
        aside[epub|type~="footnote"],
        aside[epub|type~="note"],
        aside[epub|type~="rearnote"] { display: none; }
        /* Word Wise inline hints. Wrapper stays inline-block so the
           superscript hugs its target word; pointer-events:none on the
           hint lets taps fall through to the word for the standard
           wordTapped flow. */
        .foxing-ww-wrapper { display: inline-block; }
        .foxing-ww-hint {
          display: inline-block;
          vertical-align: super;
          font-size: 0.6em;
          margin-left: 2px;
          color: ${text} !important;
          opacity: 0.55;
          font-style: italic;
          pointer-events: none;
          white-space: nowrap;
          user-select: none;
        }
      `
    }

    function isDarkColor(c) {
      // Crude darkness check — used only to set color-scheme so default
      // browser-rendered controls (links, scrollbars) match the canvas.
      const m = /^#?([0-9a-f]{6})$/i.exec(c?.replace?.('#', '') ?? '')
      if (!m) return c?.toLowerCase?.().includes('1a') || false
      const v = parseInt(m[1], 16)
      const r = (v >> 16) & 0xff, g = (v >> 8) & 0xff, b = v & 0xff
      return (0.299 * r + 0.587 * g + 0.114 * b) < 128
    }

    function applyChapterCSS(doc, theme) {
      // Inject our style into the iframe's head so it overrides anything in
      // the book's own stylesheet. setStyles() does this for already-loaded
      // sections but new sections need it re-applied on load.
      try {
        const css = chapterCSS(theme)
        let styleEl = doc.getElementById('foxing-injected-css')
        if (!styleEl) {
          styleEl = doc.createElement('style')
          styleEl.id = 'foxing-injected-css'
          doc.head.appendChild(styleEl)
        }
        styleEl.textContent = css
      } catch (e) { console.warn('applyChapterCSS failed:', e) }
    }

    function applyThemeNow(theme) {
      currentTheme = theme
      document.body.style.background = theme.background
      document.body.style.color = theme.text
      // Warm screen filter — sepia/warm CSS filter on the host body. Applies
      // to the foliate-view element too (which is the iframe parent), so the
      // tint covers everything visible.
      const filter = theme?.warmScreen
        ? 'sepia(0.25) saturate(1.05) hue-rotate(-8deg)'
        : 'none'
      document.body.style.filter = filter
      const css = chapterCSS(theme)
      view?.renderer?.setStyles?.(css)
      try {
        const contents = view?.renderer?.getContents?.() ?? []
        for (const c of contents) {
          if (c?.doc) applyChapterCSS(c.doc, theme)
        }
      } catch {}
      // Focus mode bookkeeping — refresh the "focused" paragraph in every
      // mounted doc whenever the theme changes (catches toggles).
      try {
        const contents = view?.renderer?.getContents?.() ?? []
        for (const c of contents) {
          if (c?.doc) updateFocusedParagraph(c.doc, !!theme?.focusMode)
        }
      } catch {}
    }

    function applyTheme(theme) {
      if (!view) { pendingTheme = theme; return }
      applyThemeNow(theme)
    }

    // ─────────────────────────────────────────────────────────────────────
    // Tap + drag detection inside chapter iframes
    // ─────────────────────────────────────────────────────────────────────

    // Three distinct paths:
    //   - Quick tap (<300ms, <10px move)  → word pill on the tapped word
    //   - Long press (≥300ms, <10px move) → passage pill on the tapped word
    //                                       (user can immediately re-select wider)
    //   - Drag (>10px during touch)       → passage pill on dragged range,
    //                                       with live amber overlay during drag
    // user-select:none means the OS won't render a selection during drag, so
    // we paint our own overlay rects for visual feedback.

    const TAP_DURATION_MS = 300
    const TAP_MAX_MOVE_PX = 10
    const SELECTION_OVERLAY_ID = 'foxing-selection-overlay'
    const SELECTION_FILL = 'rgba(245, 196, 96, 0.30)' // brand amber @ 30%
    const PASSAGE_DOT_CLASS = 'foxing-passage-comment-dot'

    function wireDocumentEvents(doc) {
      let startX = 0, startY = 0, startT = 0, moved = 0
      let activeTouch = null
      let inDragMode = false
      let startTarget = null

      doc.addEventListener('contextmenu', (e) => e.preventDefault(), true)

      doc.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) { activeTouch = null; return }
        const t = e.touches[0]
        startX = t.clientX
        startY = t.clientY
        startT = Date.now()
        moved = 0
        activeTouch = t.identifier
        inDragMode = false
        startTarget = e.target
        removeSelectionOverlay(doc)
      }, { passive: true })

      doc.addEventListener('touchmove', (e) => {
        if (activeTouch === null) return
        const t = Array.from(e.touches).find((x) => x.identifier === activeTouch)
        if (!t) return
        const dx = t.clientX - startX
        const dy = t.clientY - startY
        moved = Math.max(moved, Math.hypot(dx, dy))
        // Cross the 10px threshold → drag mode. Live-paint the selection
        // so the user sees what they're grabbing.
        if (!inDragMode && moved >= TAP_MAX_MOVE_PX) inDragMode = true
        if (inDragMode) drawDragOverlay(doc, startX, startY, t.clientX, t.clientY)
      }, { passive: true })

      doc.addEventListener('touchend', (e) => {
        if (activeTouch === null) return
        const t = Array.from(e.changedTouches).find((x) => x.identifier === activeTouch)
        activeTouch = null
        if (!t) return

        const endX = t.clientX
        const endY = t.clientY
        const duration = Date.now() - startT

        // Overlay only exists during the gesture — clear regardless of outcome.
        removeSelectionOverlay(doc)

        // Margin dot tap → route to passage-comment handler, skip normal flow.
        if (moved < TAP_MAX_MOVE_PX) {
          const dot = startTarget && startTarget.closest
            ? startTarget.closest('.' + PASSAGE_DOT_CLASS)
            : null
          if (dot) {
            post({
              type: 'passageCommentTapped',
              cfi: dot.getAttribute('data-cfi'),
              passageText: dot.getAttribute('data-passage-text') || '',
            })
            return
          }
        }

        if (moved >= TAP_MAX_MOVE_PX) {
          handleDrag(doc, startX, startY, endX, endY)
        } else if (duration >= TAP_DURATION_MS) {
          handleLongPress(doc, endX, endY)
        } else {
          handleTap(doc, endX, endY, duration)
        }
      }, { passive: true })

      doc.addEventListener('touchcancel', () => {
        activeTouch = null
        inDragMode = false
        removeSelectionOverlay(doc)
      }, { passive: true })
    }

    function handleTap(doc, x, y, _duration) {
      // Word Wise shortcut — tapping a hint wrapper (or its superscript)
      // routes straight into the word lookup flow for the wrapped word.
      // Per task.md Section 2c, Word Wise should feel like a shortcut into
      // Word Lookup, not a separate surface.
      const hitEl = doc.elementFromPoint(x, y)
      const wwWrapper = hitEl?.closest?.('.' + WW_WRAPPER_CLASS)
      if (wwWrapper) {
        const word = wwWrapper.getAttribute('data-ww-original') || ''
        if (word) {
          const range = doc.createRange()
          range.selectNodeContents(wwWrapper)
          const surroundingText = extractSurroundingSentence(range)
          const cfi = safeGetCFI(range)
          const rect = mapRectToHostDoc(doc, wwWrapper.getBoundingClientRect())
          post({ type: 'wordTapped', word, cfi, surroundingText, rect })
          return
        }
      }

      const range = caretRangeAt(doc, x, y)
      if (!range) {
        // Hit empty area — chrome toggle.
        post({ type: 'tap' })
        return
      }
      const wordRange = expandRangeToWord(range)
      if (!wordRange) {
        post({ type: 'tap' })
        return
      }
      const word = wordRange.toString().trim()
      if (!word || !/[\p{L}\p{N}]/u.test(word)) {
        post({ type: 'tap' })
        return
      }

      const surroundingText = extractSurroundingSentence(wordRange)
      const cfi = safeGetCFI(wordRange)
      if (cfi === null) console.warn('[reader] CFI null for word tap:', word)
      const rect = mapRectToHostDoc(doc, wordRange.getBoundingClientRect())
      post({ type: 'wordTapped', word, cfi, surroundingText, rect })
    }

    // Long press on a word emits a passage selection on just that word, so
    // the user lands in passage-mode (Analyze/Highlight/Discuss). They can
    // re-drag immediately if they want a longer span.
    function handleLongPress(doc, x, y) {
      const range = caretRangeAt(doc, x, y)
      if (!range) {
        post({ type: 'tap' })
        return
      }
      const wordRange = expandRangeToWord(range)
      if (!wordRange) {
        post({ type: 'tap' })
        return
      }
      const text = wordRange.toString().trim()
      if (!text || !/[\p{L}\p{N}]/u.test(text)) {
        post({ type: 'tap' })
        return
      }
      const cfi = safeGetCFI(wordRange)
      if (cfi === null) console.warn('[reader] CFI null for long press:', text)
      const rect = mapRectToHostDoc(doc, wordRange.getBoundingClientRect())
      post({ type: 'passageSelected', text, cfi, rect })
    }

    function handleDrag(doc, sx, sy, ex, ey) {
      const startRange = caretRangeAt(doc, sx, sy)
      const endRange = caretRangeAt(doc, ex, ey)
      if (!startRange || !endRange) {
        post({ type: 'tap' })
        return
      }
      const range = doc.createRange()
      // Order start/end by document position so the Range is well-formed
      // regardless of drag direction.
      const cmp = startRange.compareBoundaryPoints(Range.START_TO_START, endRange)
      const a = cmp <= 0 ? startRange : endRange
      const b = cmp <= 0 ? endRange : startRange
      try {
        range.setStart(a.startContainer, a.startOffset)
        range.setEnd(b.endContainer, b.endOffset)
      } catch {
        post({ type: 'tap' })
        return
      }
      const text = range.toString().trim()
      if (!text || text.length < 2) {
        post({ type: 'tap' })
        return
      }
      const cfi = safeGetCFI(range)
      if (cfi === null) console.warn('[reader] CFI null for drag selection, len:', text.length)
      const rect = mapRectToHostDoc(doc, range.getBoundingClientRect())
      post({ type: 'passageSelected', text, cfi, rect })
    }

    // Live selection overlay: paint a translucent amber rect over each
    // client rect of the in-progress range. Appended to the iframe body
    // so it scrolls/transforms with the content; pointer-events:none so
    // it never blocks taps.
    function drawDragOverlay(doc, sx, sy, ex, ey) {
      const startRange = caretRangeAt(doc, sx, sy)
      const endRange = caretRangeAt(doc, ex, ey)
      if (!startRange || !endRange) return
      const range = doc.createRange()
      const cmp = startRange.compareBoundaryPoints(Range.START_TO_START, endRange)
      const a = cmp <= 0 ? startRange : endRange
      const b = cmp <= 0 ? endRange : startRange
      try {
        range.setStart(a.startContainer, a.startOffset)
        range.setEnd(b.endContainer, b.endOffset)
      } catch { return }
      showSelectionOverlay(doc, range)
    }

    function showSelectionOverlay(doc, range) {
      removeSelectionOverlay(doc)
      const rects = range.getClientRects()
      if (!rects.length) return
      // getClientRects() returns viewport-local coords. To anchor absolute
      // children to the body, add the iframe's scroll offset.
      const scrollX = doc.defaultView?.scrollX ?? doc.documentElement.scrollLeft ?? 0
      const scrollY = doc.defaultView?.scrollY ?? doc.documentElement.scrollTop ?? 0
      const overlay = doc.createElement('div')
      overlay.id = SELECTION_OVERLAY_ID
      overlay.style.cssText = 'position:absolute;top:0;left:0;width:0;height:0;pointer-events:none;z-index:2147483646;'
      for (const r of rects) {
        if (r.width <= 0 || r.height <= 0) continue
        const cell = doc.createElement('div')
        cell.style.cssText =
          'position:absolute;' +
          'left:' + (r.left + scrollX) + 'px;' +
          'top:' + (r.top + scrollY) + 'px;' +
          'width:' + r.width + 'px;' +
          'height:' + r.height + 'px;' +
          'background:' + SELECTION_FILL + ';' +
          'border-radius:2px;' +
          'pointer-events:none;'
        overlay.appendChild(cell)
      }
      doc.body.appendChild(overlay)
    }

    function removeSelectionOverlay(doc) {
      const el = doc.getElementById(SELECTION_OVERLAY_ID)
      if (el && el.parentNode) el.parentNode.removeChild(el)
    }

    // ─────────────────────────────────────────────────────────────────────
    // Range helpers
    // ─────────────────────────────────────────────────────────────────────

    function caretRangeAt(doc, x, y) {
      // caretRangeFromPoint is the Chrome/WebKit API used by Android
      // System WebView. caretPositionFromPoint is the Firefox spec name
      // (returns {offsetNode, offset}); fall back to it just in case.
      if (typeof doc.caretRangeFromPoint === 'function') {
        return doc.caretRangeFromPoint(x, y)
      }
      if (typeof doc.caretPositionFromPoint === 'function') {
        const p = doc.caretPositionFromPoint(x, y)
        if (!p) return null
        const r = doc.createRange()
        r.setStart(p.offsetNode, p.offset)
        r.setEnd(p.offsetNode, p.offset)
        return r
      }
      return null
    }

    // Word characters: letters/numbers/apostrophes/hyphens. Unicode-aware so
    // accented words ("naïveté") match cleanly.
    const WORD_CHAR_RE = /[\p{L}\p{N}'\-’]/u

    function expandRangeToWord(range) {
      const node = range.startContainer
      if (node.nodeType !== Node.TEXT_NODE) return null
      const text = node.nodeValue ?? ''
      let start = range.startOffset
      let end = range.startOffset
      while (start > 0 && WORD_CHAR_RE.test(text[start - 1])) start--
      while (end < text.length && WORD_CHAR_RE.test(text[end])) end++
      if (start === end) return null
      const r = node.ownerDocument.createRange()
      r.setStart(node, start)
      r.setEnd(node, end)
      return r
    }

    function extractSurroundingSentence(wordRange) {
      // Walk the parent text content for sentence terminators on either
      // side of the word. Falls back to the whole paragraph if no
      // terminator is found within ~500 chars in either direction.
      const node = wordRange.startContainer
      if (node.nodeType !== Node.TEXT_NODE) return wordRange.toString()
      const block = node.parentElement?.closest?.('p, li, blockquote, dd, div, section') ?? node.parentElement
      // Clone the block and strip Word Wise hint sups so the AI sees the
      // book's prose, not "fastidiousfussy" with the hint glued on.
      let rawText = ''
      if (block) {
        const clone = block.cloneNode(true)
        const hints = clone.querySelectorAll?.('.foxing-ww-hint') ?? []
        for (const h of hints) h.parentNode?.removeChild(h)
        rawText = clone.innerText ?? clone.textContent ?? ''
      } else {
        rawText = node.nodeValue ?? ''
      }
      const text = rawText.replace(/\s+/g, ' ').trim()
      if (!text) return wordRange.toString()

      const word = wordRange.toString().trim()
      const idx = text.indexOf(word)
      if (idx < 0) return text.length > 240 ? word : text

      // Walk back to previous sentence terminator + space.
      let start = idx
      const back = text.lastIndexOf('. ', idx - 1)
      const back2 = text.lastIndexOf('! ', idx - 1)
      const back3 = text.lastIndexOf('? ', idx - 1)
      const startCandidate = Math.max(back, back2, back3)
      if (startCandidate >= 0 && idx - startCandidate < 500) start = startCandidate + 2
      else start = Math.max(0, idx - 240)

      // Walk forward to next sentence terminator.
      let end = idx + word.length
      const f1 = text.indexOf('. ', end)
      const f2 = text.indexOf('! ', end)
      const f3 = text.indexOf('? ', end)
      const candidates = [f1, f2, f3].filter((n) => n >= 0)
      const endCandidate = candidates.length ? Math.min(...candidates) : -1
      if (endCandidate >= 0 && endCandidate - end < 500) end = endCandidate + 1
      else end = Math.min(text.length, end + 240)

      return text.slice(start, end).trim()
    }

    function safeGetCFI(range) {
      try { return view?.getCFI?.(currentIndex(), range) ?? null }
      catch { return null }
    }

    function mapRectToHostDoc(doc, rect) {
      // Range coords are iframe-local. The iframe itself is positioned
      // somewhere inside the host doc — convert by adding the iframe's
      // own getBoundingClientRect so the host (and React Native) sees
      // coords relative to the WebView's render area.
      try {
        const frame = doc.defaultView?.frameElement
        const off = frame ? frame.getBoundingClientRect() : { left: 0, top: 0 }
        return {
          x: rect.left + off.left,
          y: rect.top + off.top,
          width: rect.width,
          height: rect.height,
        }
      } catch {
        return { x: rect.left, y: rect.top, width: rect.width, height: rect.height }
      }
    }

    // ─────────────────────────────────────────────────────────────────────
    // Highlights — visual overlay
    // ─────────────────────────────────────────────────────────────────────
    // The host stores the canonical highlight list in Supabase; the WebView
    // just paints what the host tells it to via addHighlight/removeHighlight.

    async function addHighlight(cfi, color) {
      if (!view || !cfi) return
      try {
        await view.addAnnotation({ value: cfi, color })
      } catch (e) { post({ type: 'error', message: 'addHighlight failed: ' + (e?.message || 'unknown') }) }
    }

    async function removeHighlight(cfi) {
      if (!view || !cfi) return
      try { await view.deleteAnnotation({ value: cfi }) }
      catch {}
    }

    // foliate-view emits 'draw-annotation' so its overlayer knows what fill
    // to use for our annotation. The host pushes the active palette in via
    // setHighlightColors() right after applyTheme(), so dark vs light mode
    // stays in sync with the design tokens shown in the FloatingPill swatches.
    let highlightColorMap = {
      amber:   '#F5C060',
      auburn:  '#F0A070',
      yellow:  '#F4E47B',
      sage:    '#72CA9A',
      cobalt:  '#70A6DB',
      crimson: '#E46872',
      purple:  '#B58DE2',
    }

    function setHighlightColors(map) {
      if (!map || typeof map !== 'object') return
      highlightColorMap = { ...highlightColorMap, ...map }
    }

    function wireAnnotationDraw() {
      view?.addEventListener?.('draw-annotation', (e) => {
        const { draw, annotation } = e.detail
        const color = highlightColorMap[annotation?.color] || highlightColorMap.amber
        // Overlayer is loaded at runtime by foliate; the highlight function
        // is its built-in renderer for translucent rect highlights.
        const overlay = view?.constructor?.Overlayer ?? globalThis.Overlayer
        if (overlay?.highlight) {
          draw(overlay.highlight, { color })
        } else {
          // Fallback: tag with color so the user sees something even if the
          // highlight renderer wasn't loaded.
          draw((ctx, rects) => {
            ctx.fillStyle = color
            for (const r of rects) ctx.fillRect(r.x, r.y, r.width, r.height)
          }, { color })
        }
      })
    }

    async function goToCfi(cfi) {
      if (!view || !cfi) return
      try { await view.goTo(cfi) }
      catch (e) { post({ type: 'error', message: 'goTo failed: ' + (e?.message || 'unknown') }) }
    }

    // ─────────────────────────────────────────────────────────────────────
    // Inline passage comments — margin dots
    // ─────────────────────────────────────────────────────────────────────
    // Host pushes the full list of club comments for this book once on
    // open; we re-paint dots whenever a new chapter loads. Each dot sits
    // in the paragraph's left margin and posts passageCommentTapped on
    // tap (the host opens PassageCommentSheet from there).

    let passageComments = []
    let passageDotColor = '#D4622E' // brand-ui fallback; can be overridden by host

    function setPassageComments(list, colorHex) {
      passageComments = Array.isArray(list) ? list : []
      if (colorHex && typeof colorHex === 'string') passageDotColor = colorHex
      paintAllVisibleDots()
    }

    async function paintAllVisibleDots() {
      const contents = view?.renderer?.getContents?.() ?? []
      for (const c of contents) {
        if (c?.doc) await paintCommentDotsInDoc(c.doc)
      }
    }

    async function paintCommentDotsInDoc(doc) {
      // Wipe previous dots first so re-paints don't double-dot.
      const existing = doc.querySelectorAll('.' + PASSAGE_DOT_CLASS)
      for (const el of existing) el.remove()
      if (passageComments.length === 0) return

      // Dedupe at the paragraph level — a paragraph with three comments
      // still gets just one dot. The sheet shows all of them when tapped.
      const seenParagraphs = new Set()
      for (const c of passageComments) {
        const cfi = c?.cfi
        if (!cfi) continue
        const range = await tryResolveCfi(cfi)
        if (!range) continue
        if (range.startContainer?.ownerDocument !== doc) continue
        const node = range.startContainer
        const startEl = node.nodeType === Node.TEXT_NODE ? node.parentElement : node
        const paraEl = startEl?.closest?.('p, li, blockquote, dd')
        if (!paraEl || seenParagraphs.has(paraEl)) continue
        seenParagraphs.add(paraEl)
        addCommentDot(doc, paraEl, c)
      }
    }

    async function tryResolveCfi(cfi) {
      if (!view) return null
      // foliate-view exposes resolveCFI in newer versions; older builds
      // hang the same logic off view.book. Try both, swallow errors.
      try {
        if (typeof view.resolveCFI === 'function') {
          const r = view.resolveCFI(cfi)
          return r && typeof r.then === 'function' ? await r : r
        }
        if (typeof view.book?.resolveCFI === 'function') {
          const r = view.book.resolveCFI(cfi)
          return r && typeof r.then === 'function' ? await r : r
        }
      } catch {}
      return null
    }

    // ─────────────────────────────────────────────────────────────────────
    // Popular highlights — small "X readers highlighted this" labels
    // ─────────────────────────────────────────────────────────────────────
    // Same CFI→paragraph resolution as comment dots, but renders a tiny
    // text label as the last child of the matched paragraph. Disabled by
    // default — the host opts in by passing a non-empty list.

    let popularHighlights = []
    let popularLabelColor = '#815E41'
    const POPULAR_LABEL_CLASS = 'foxing-popular-highlight-label'

    function setPopularHighlights(list, colorHex) {
      popularHighlights = Array.isArray(list) ? list : []
      if (colorHex && typeof colorHex === 'string') popularLabelColor = colorHex
      paintAllPopularLabels()
    }

    async function paintAllPopularLabels() {
      const contents = view?.renderer?.getContents?.() ?? []
      for (const c of contents) {
        if (c?.doc) await paintPopularLabelsInDoc(c.doc)
      }
    }

    async function paintPopularLabelsInDoc(doc) {
      const existing = doc.querySelectorAll('.' + POPULAR_LABEL_CLASS)
      for (const el of existing) el.remove()
      if (popularHighlights.length === 0) return
      const seenParagraphs = new Set()
      for (const h of popularHighlights) {
        const cfi = h?.cfi
        if (!cfi) continue
        const range = await tryResolveCfi(cfi)
        if (!range) continue
        if (range.startContainer?.ownerDocument !== doc) continue
        const node = range.startContainer
        const startEl = node.nodeType === Node.TEXT_NODE ? node.parentElement : node
        const paraEl = startEl?.closest?.('p, li, blockquote, dd')
        if (!paraEl || seenParagraphs.has(paraEl)) continue
        seenParagraphs.add(paraEl)
        const label = doc.createElement('div')
        label.className = POPULAR_LABEL_CLASS
        label.textContent = `${h.count} readers highlighted this`
        label.style.cssText =
          'font-size:10px;' +
          'opacity:0.6;' +
          'margin-top:4px;' +
          'color:' + popularLabelColor + ';' +
          'pointer-events:none;'
        paraEl.appendChild(label)
      }
    }

    function addCommentDot(doc, paraEl, comment) {
      // paraEl needs to be position:relative so the absolutely-positioned
      // dot anchors to it. Use inline style so the book's CSS doesn't fight.
      const computed = doc.defaultView?.getComputedStyle(paraEl)
      if (computed && computed.position === 'static') {
        paraEl.style.position = 'relative'
      }
      const dot = doc.createElement('span')
      dot.className = PASSAGE_DOT_CLASS
      dot.setAttribute('data-cfi', String(comment.cfi))
      // Fall back to paragraph text so the sheet still has SOMETHING to
      // show even if the comment row lost its snippet.
      const snippet = comment.passageText
        || (paraEl.innerText || paraEl.textContent || '').slice(0, 240)
      dot.setAttribute('data-passage-text', snippet)
      dot.setAttribute('aria-label', 'Open passage comments')
      dot.style.cssText =
        'position:absolute;' +
        'left:-14px;' +
        'top:0.55em;' +
        'width:6px;height:6px;' +
        'border-radius:3px;' +
        'background:' + passageDotColor + ';' +
        'cursor:pointer;' +
        'z-index:10;' +
        'pointer-events:auto;'
      paraEl.appendChild(dot)
    }

    function goNext() { view?.renderer?.next() }
    function goPrev() { view?.renderer?.prev() }

    // ─────────────────────────────────────────────────────────────────────
    // Renderer attribute toggles (flow / columns / animation)
    // ─────────────────────────────────────────────────────────────────────
    // Foliate's paginator + scroll renderers are configured via DOM
    // attributes on the renderer element. We expose three setters so the
    // host can flip them live without re-opening the book.

    function setFlow(mode) {
      // 'paginated' (default) or 'scrolled'. setAttribute on the renderer
      // triggers a re-layout of the current section; reader stays at the
      // same logical position because foliate restores via CFI internally.
      const value = mode === 'scrolled' ? 'scrolled' : 'paginated'
      try { view?.renderer?.setAttribute?.('flow', value) }
      catch (e) { post({ type: 'error', message: 'setFlow failed: ' + (e?.message || 'unknown') }) }
    }

    function setColumns(count) {
      // Single (1) or two-column spread (2). Foliate's paginator reads
      // max-column-count to derive the layout. Caps at 2 since we only
      // expose single/two in the UI.
      const n = count === 2 ? 2 : 1
      try { view?.renderer?.setAttribute?.('max-column-count', String(n)) }
      catch (e) { post({ type: 'error', message: 'setColumns failed: ' + (e?.message || 'unknown') }) }
    }

    function setAnimation(mode) {
      // 'none' disables page-turn animation entirely; 'slide' (default) and
      // 'fade' both keep it enabled. Foliate's renderer doesn't ship a
      // first-class fade transition, so 'fade' currently falls back to
      // the slide animation — accurate-enough until we customize it.
      const animated = mode === 'none' ? 'false' : 'true'
      try { view?.renderer?.setAttribute?.('animated', animated) }
      catch (e) { post({ type: 'error', message: 'setAnimation failed: ' + (e?.message || 'unknown') }) }
    }

    // ─────────────────────────────────────────────────────────────────────
    // AI Word Wise — inline superscript hints
    // ─────────────────────────────────────────────────────────────────────
    // Enable/disable comes from the host via prefs. Hints arrive per-page
    // after the host fetches them from the wordWise Edge Function action.
    // We only mutate text nodes in the active iframe doc and undo the
    // mutation before applying new hints.

    let wordWiseEnabled = false
    const WW_WRAPPER_CLASS = 'foxing-ww-wrapper'
    const WW_HINT_CLASS = 'foxing-ww-hint'

    function setWordWiseEnabled(enabled) {
      wordWiseEnabled = !!enabled
      if (!wordWiseEnabled) clearAllWordWiseHints()
    }

    function clearAllWordWiseHints() {
      const contents = view?.renderer?.getContents?.() ?? []
      for (const c of contents) if (c?.doc) clearWordWiseHints(c.doc)
    }

    function clearWordWiseHints(doc) {
      const wrappers = doc.querySelectorAll('.' + WW_WRAPPER_CLASS)
      for (const w of wrappers) {
        const parent = w.parentNode
        if (!parent) continue
        // Replace the wrapper with a text node of the original word.
        const word = w.getAttribute('data-ww-original') || w.firstChild?.nodeValue || ''
        parent.replaceChild(doc.createTextNode(word), w)
      }
    }

    function applyWordWiseHints(hints) {
      if (!wordWiseEnabled) return
      const list = Array.isArray(hints) ? hints : []
      const contents = view?.renderer?.getContents?.() ?? []
      for (const c of contents) {
        if (!c?.doc) continue
        if (c.index !== _currentIndex) continue
        clearWordWiseHints(c.doc)
        for (const h of list) {
          if (h?.word && h?.hint) injectHint(c.doc, String(h.word), String(h.hint))
        }
      }
    }

    function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') }

    function injectHint(doc, word, hint) {
      // Walk visible text nodes for the first match. Skip nodes already
      // inside a wrapper so we don't re-wrap on a re-apply.
      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, {
        acceptNode: (n) => {
          if (!n.nodeValue) return NodeFilter.FILTER_REJECT
          if (n.parentElement?.closest('.' + WW_WRAPPER_CLASS)) return NodeFilter.FILTER_REJECT
          // Skip <script>/<style>/hidden subtrees.
          const tag = n.parentElement?.tagName?.toLowerCase()
          if (tag === 'script' || tag === 'style') return NodeFilter.FILTER_REJECT
          return NodeFilter.FILTER_ACCEPT
        },
      })
      const re = new RegExp(`\\b${escapeRegex(word)}\\b`, 'i')
      let node
      while ((node = walker.nextNode())) {
        const text = node.nodeValue
        const m = re.exec(text)
        if (!m) continue
        const before = text.slice(0, m.index)
        const matched = text.slice(m.index, m.index + m[0].length)
        const after = text.slice(m.index + m[0].length)
        const wrapper = doc.createElement('span')
        wrapper.className = WW_WRAPPER_CLASS
        wrapper.setAttribute('data-ww-original', matched)
        wrapper.appendChild(doc.createTextNode(matched))
        const sup = doc.createElement('sup')
        sup.className = WW_HINT_CLASS
        sup.textContent = hint
        sup.setAttribute('aria-label', `Hint: ${hint}`)
        wrapper.appendChild(sup)
        const parent = node.parentNode
        if (!parent) return
        if (before) parent.insertBefore(doc.createTextNode(before), node)
        parent.insertBefore(wrapper, node)
        if (after) parent.insertBefore(doc.createTextNode(after), node)
        parent.removeChild(node)
        return // first occurrence only
      }
    }

    // ─────────────────────────────────────────────────────────────────────
    // Phase D — auto-scroll, focus mode, TTS bridge
    // ─────────────────────────────────────────────────────────────────────

    let autoScrollTimer = null

    function startAutoScroll(wpm) {
      if (autoScrollTimer) clearInterval(autoScrollTimer)
      const safeWpm = Math.max(50, Math.min(800, Number(wpm) || 220))
      // Estimate page word count from the visible doc; fall back to 250.
      const sample = readVisiblePage()
      const pageWords = sample.wordCount > 0 ? sample.wordCount : 250
      const minutesPerPage = pageWords / safeWpm
      const intervalMs = Math.max(2000, Math.round(minutesPerPage * 60_000))
      autoScrollTimer = setInterval(() => {
        try { view?.renderer?.next?.() } catch {}
      }, intervalMs)
    }

    function stopAutoScroll() {
      if (autoScrollTimer) {
        clearInterval(autoScrollTimer)
        autoScrollTimer = null
      }
    }

    // Focus mode — add `.foxing-focused` to the paragraph nearest the
    // vertical center of the iframe viewport. Called on scroll / relocate.
    function updateFocusedParagraph(doc, enabled) {
      if (!doc?.body) return
      const existing = doc.querySelector('.foxing-focused')
      if (existing) existing.classList.remove('foxing-focused')
      if (!enabled) return
      const win = doc.defaultView
      if (!win) return
      const midY = (win.innerHeight || 480) / 2
      const candidates = doc.querySelectorAll('p, li, blockquote, dd')
      let best = null
      let bestDist = Infinity
      for (const el of candidates) {
        const r = el.getBoundingClientRect()
        if (r.height === 0) continue
        const center = r.top + r.height / 2
        const dist = Math.abs(center - midY)
        if (dist < bestDist) {
          bestDist = dist
          best = el
        }
      }
      if (best) best.classList.add('foxing-focused')
    }

    // ── TTS bridge helpers ────────────────────────────────────────────────

    // Returns plain text of the currently visible iframe. The host splits
    // into sentences and speaks them via expo-speech.
    function getChapterText() {
      const contents = view?.renderer?.getContents?.() ?? []
      const visible = contents.find((c) => c.index === _currentIndex)
      if (!visible?.doc) return ''
      return (visible.doc.body?.innerText ?? '').trim()
    }

    // Returns one entry per paragraph in the visible iframe, in document
    // order. Used by the host's bilingual-mode effect — it sends these
    // strings to the translation Edge Function and pushes the returned
    // translations back in via setBilingualContent (which appends in the
    // same order).
    function getChapterParagraphs() {
      const contents = view?.renderer?.getContents?.() ?? []
      const visible = contents.find((c) => c.index === _currentIndex)
      if (!visible?.doc) return []
      const out = []
      const nodes = visible.doc.querySelectorAll('p, li, blockquote, dd')
      for (const el of nodes) {
        const text = (el.innerText ?? el.textContent ?? '').trim()
        // Skip empty + ultra-short fragments — they translate poorly and
        // would just clutter the layout with stub italics under them.
        if (text.length >= 8) out.push(text)
      }
      return out
    }

    // Append small italic translation divs under each paragraph in the
    // visible iframe. The Nth translation goes under the Nth qualifying
    // paragraph (same filter as getChapterParagraphs). Calling with an
    // empty array clears existing translations.
    function setBilingualContent(translations) {
      const contents = view?.renderer?.getContents?.() ?? []
      for (const c of contents) {
        if (!c?.doc) continue
        // Clear previous regardless of input — bilingual mode toggle off
        // funnels through here with an empty array.
        const existing = c.doc.querySelectorAll('.foxing-bilingual')
        for (const el of existing) el.remove()
      }
      if (!Array.isArray(translations) || translations.length === 0) return
      const visible = contents.find((c) => c.index === _currentIndex)
      if (!visible?.doc) return
      const doc = visible.doc
      const nodes = doc.querySelectorAll('p, li, blockquote, dd')
      let translationIndex = 0
      for (const el of nodes) {
        const text = (el.innerText ?? el.textContent ?? '').trim()
        if (text.length < 8) continue
        const translation = translations[translationIndex]
        translationIndex += 1
        if (!translation) continue
        const div = doc.createElement('div')
        div.className = 'foxing-bilingual'
        div.textContent = translation
        // Token-aligned with the design — small italic, tertiary text, left
        // accent matching brand-subtle. Inline styles so the book's CSS
        // can't override them.
        div.style.cssText =
          'font-size:0.8em;' +
          'font-style:italic;' +
          'color:' + ((currentTheme && currentTheme.text) || '#815E41') + ';' +
          'opacity:0.7;' +
          'border-left:2px solid ' + (passageDotColor || '#FAE0D6') + ';' +
          'padding-left:8px;' +
          'margin-top:4px;' +
          'margin-bottom:8px;'
        // Insert after the paragraph rather than as a child — keeps the
        // paragraph's own selection/highlight behavior clean.
        if (el.parentNode) {
          el.parentNode.insertBefore(div, el.nextSibling)
        }
      }
    }

    // Returns the book's TOC as a flat array of { label, href, cfi }.
    function getToc() {
      try {
        const toc = view?.book?.toc ?? []
        const out = []
        const walk = (items) => {
          if (!Array.isArray(items)) return
          for (const it of items) {
            out.push({
              label: String(it?.label ?? '').trim(),
              href: String(it?.href ?? ''),
              cfi: it?.cfi ?? null,
            })
            if (Array.isArray(it?.subitems) && it.subitems.length > 0) walk(it.subitems)
          }
        }
        walk(toc)
        return out
      } catch (e) {
        return []
      }
    }

    // Underlines the Nth (1-based) sentence in the currently visible doc.
    // Pass null to clear. Best-effort — uses a sentence-split regex on the
    // body's text, then walks text nodes accumulating offsets to locate it.
    function highlightSentence(index) {
      const contents = view?.renderer?.getContents?.() ?? []
      const visible = contents.find((c) => c.index === _currentIndex)
      if (!visible?.doc) return
      const doc = visible.doc
      // Clear existing.
      const existing = doc.querySelectorAll('.foxing-tts-current')
      for (const el of existing) {
        const parent = el.parentNode
        if (!parent) continue
        const text = el.firstChild?.nodeValue ?? ''
        parent.replaceChild(doc.createTextNode(text), el)
      }
      if (index === null || index < 1) return
      // Split full body text into sentences and find the index'th one's
      // [start, end] in the concatenated text.
      const fullText = doc.body?.innerText ?? ''
      const sentenceRegex = /[^.!?]+[.!?]+["')\]]*\s*/g
      const sentences = fullText.match(sentenceRegex) ?? []
      if (index > sentences.length) return
      let absStart = 0
      for (let i = 0; i < index - 1; i++) absStart += sentences[i].length
      const sentence = sentences[index - 1].trim()
      if (!sentence) return
      // Walk text nodes, find a contiguous text node containing this sentence.
      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT)
      let node
      while ((node = walker.nextNode())) {
        const idx = (node.nodeValue ?? '').indexOf(sentence)
        if (idx >= 0) {
          try {
            const range = doc.createRange()
            range.setStart(node, idx)
            range.setEnd(node, idx + sentence.length)
            const span = doc.createElement('span')
            span.className = 'foxing-tts-current'
            range.surroundContents(span)
          } catch {}
          return
        }
      }
    }

    // Patched openBook also hooks the annotation draw event after the view
    // is created, so we wire it once here:
    const _origOpen = openBookFromBase64
    async function openBookFromBase64Wrapped(b64, mime) {
      const result = await _origOpen(b64, mime)
      wireAnnotationDraw()
      return result
    }

    window.foliateBridge = {
      openBookFromBase64: openBookFromBase64Wrapped,
      applyTheme,
      goToCfi,
      goNext,
      goPrev,
      addHighlight,
      removeHighlight,
      setWordWiseEnabled,
      applyWordWiseHints,
      setHighlightColors,
      setPassageComments,
      setPopularHighlights,
      startAutoScroll,
      stopAutoScroll,
      getChapterText,
      getChapterParagraphs,
      getToc,
      highlightSentence,
      setBilingualContent,
      setColumns,
      setFlow,
      setAnimation,
    }

    post({ type: 'ready' })
  </script>
</body>
</html>
