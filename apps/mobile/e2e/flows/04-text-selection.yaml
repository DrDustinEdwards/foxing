# Check: select text and trigger an action.
#
# The reader text lives inside the foliate WebView. Maestro cannot drive the
# native selection handles reliably, so this flow exercises the two real entry
# points the reader exposes from text:
#   1. Single tap on a word -> floating pill (word mode) -> Look up -> WordLookupSheet
#   2. Long press on a word  -> floating pill (passage mode) -> Analyze -> PassageAnalysisSheet
#
# Both taps use a coordinate in the body text band. The exact point is content
# dependent; if a tap lands on whitespace the pill will not appear. Adjust the
# percentages for your test book if needed. This is the flakiest flow by nature.
appId: com.foxing.app
env:
  BOOK_ID: "REPLACE_WITH_A_REAL_BOOK_ID"
tags:
  - reader
  - selection
---
- runFlow: ../common/open-reader.yaml
# Dismiss chrome so the tap reaches the text, not a bar.
- tapOn:
    point: "50%, 50%"

# --- Word tap -> pill -> Look up -> WordLookupSheet ---
- tapOn:
    point: "30%, 45%"
- assertVisible: "Look up"
- tapOn: "Look up"
- assertVisible: "Close word lookup"
- tapOn:
    id: "Close word lookup"
- takeScreenshot: 04-word-lookup

# --- Long press -> passage pill -> Analyze -> PassageAnalysisSheet ---
# Re-tap empty area first to clear any lingering pill.
- tapOn:
    point: "50%, 50%"
- longPressOn:
    point: "30%, 55%"
# Solo passage layout shows Analyze; a club-reader layout shows it too.
- assertVisible: "Analyze"
- tapOn: "Analyze"
# PassageAnalysisSheet renders its mode chips; "Plain English" is the first.
- assertVisible: "Plain English"
- tapOn: "Close"
- takeScreenshot: 04-passage-analysis
