# Check: select text and trigger an action via the unified contextual menu.
#
# Phase 2: word and passage share one menu whose actions adapt to the
# selection. The primary action is labeled; secondary actions are icon-only
# but carry accessibility labels (Look up, Highlight, Translate, Ask, Analyze,
# Comment), so Maestro can match them by text.
#
# Selection happens inside the foliate WebView, which Maestro cannot drive
# precisely, so the taps use fixed coordinates in the body text band. If a tap
# lands on whitespace the menu will not appear; adjust the percentages for your
# test book. This is the flakiest flow by nature.
#
# Requires a Foxing Plus account: Look up, Analyze, Ask, and Translate are
# Plus-gated. On a free account they show a lock badge and open the upgrade
# prompt instead of the AI sheet. See e2e/README.md.
appId: com.foxing.app
env:
  BOOK_ID: "REPLACE_WITH_A_REAL_BOOK_ID"
tags:
  - reader
  - selection
---
- runFlow: ../common/open-reader.yaml
# Dismiss chrome so the tap reaches the text, not a bar.
- tapOn:
    point: "50%, 50%"

# --- Word tap -> unified menu -> Look up -> WordLookupSheet ---
- tapOn:
    point: "30%, 45%"
- assertVisible: "Look up"
- assertVisible: "Translate"
- tapOn: "Look up"
- assertVisible: "Close word lookup"
- tapOn:
    id: "Close word lookup"
- takeScreenshot: 04-word-lookup

# --- Long press -> passage menu -> Analyze -> PassageAnalysisSheet ---
- tapOn:
    point: "50%, 50%"
- longPressOn:
    point: "30%, 55%"
- assertVisible: "Analyze"
- assertVisible: "Translate"
- tapOn: "Analyze"
# PassageAnalysisSheet renders its mode chips; "Plain English" is the first.
- assertVisible: "Plain English"
- tapOn: "Close"
- takeScreenshot: 04-passage-analysis

# --- Translate path -> TranslateSheet (side by side) ---
- tapOn:
    point: "50%, 50%"
- longPressOn:
    point: "30%, 55%"
- assertVisible: "Translate"
- tapOn: "Translate"
- assertVisible: "Close translation"
- tapOn: "Close translation"
- takeScreenshot: 04-translate
