name: No-bloat report (warn-only)

# Knip and jscpd through devkit-no-bloat --warn-only, each count against the baseline in .no-bloat.json. A count above
# its baseline is a ::warning:: and the job still passes. This is devkit's no-bloat.yml with a pnpm install; it moves to
# calling that workflow once devkit's takes pnpm (as worker-size.yml does). Docs-only changes do not trigger it.
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "knip.jsonc"
      - ".jscpd.json"
      - ".no-bloat.json"
      - ".github/workflows/no-bloat.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: no-bloat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # No lifecycle scripts. devkit-no-bloat runs Knip and jscpd through npx at the versions in .no-bloat.json.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check:bloat
