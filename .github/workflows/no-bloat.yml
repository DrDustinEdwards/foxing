name: no-bloat

# Knip and jscpd through devkit's no-bloat.yml, each count against the baseline in .no-bloat.json: a count above it
# fails. Lower it with `npx devkit-no-bloat --write-baseline` when a count goes down. Docs-only changes do not trigger it.
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "knip.jsonc"
      - ".jscpd.json"
      - ".no-bloat.json"
      - ".github/workflows/no-bloat.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: no-bloat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    uses: DrDustinEdwards/devkit/.github/workflows/no-bloat.yml@a4c3bbf859fe126913e28c6199ff66fa98e0261d # v0.21.4
    with:
      package-manager: npm
      # No lifecycle scripts. devkit-no-bloat runs Knip and jscpd through npx at the versions in .no-bloat.json.
      install: 'npm ci --ignore-scripts'
