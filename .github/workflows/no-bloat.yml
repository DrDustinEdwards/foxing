name: no-bloat

# Knip and jscpd through devkit's no-bloat.yml, each count against the baseline in .no-bloat.json: a count above it
# fails. Lower it with `npx devkit-no-bloat --write-baseline` when a count goes down. Docs-only changes do not trigger it.
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "knip.jsonc"
      - ".jscpd.json"
      - ".no-bloat.json"
      - ".github/workflows/no-bloat.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: no-bloat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    uses: DrDustinEdwards/devkit/.github/workflows/no-bloat.yml@520882e59f98ae19dd55bfe45d772ea42819596e # v0.15.0
    with:
      package-manager: pnpm
      # No lifecycle scripts. devkit-no-bloat runs Knip and jscpd through npx at the versions in .no-bloat.json.
      install: pnpm install --frozen-lockfile --ignore-scripts
