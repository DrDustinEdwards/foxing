name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web test

  rls-regression:
    # Re-runs the club reads that hit 42P17 infinite recursion before the
    # Pass 1 fix, against the live DB. Push-only so the secret is present.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/rls-regression.sql via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          body=$(jq -Rs '{query: .}' scripts/rls-regression.sql)
          resp=$(curl -sf -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "$body" \
            https://api.supabase.com/v1/projects/ekjpsuewrkvqzbuteurc/database/query)
          echo "$resp"
          echo "$resp" | jq -e '.[0].rls_regression | type == "object" and all(.[]; . == true)'
