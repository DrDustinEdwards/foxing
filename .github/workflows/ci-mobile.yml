name: CI (mobile)

# Lints and format-checks apps/mobile with the root Oxlint and Oxfmt configs (oxlint.config.ts, oxfmt.config.ts).
# Pull requests only: no deploy reads it, and the merge was checked as a pull request (devkit README, "No second run on
# main").
on:
  # Every pull request, with no paths filter: these jobs are required checks, and a required check whose workflow a
  # paths filter skips stays Pending and blocks the merge (GitHub Docs, "Troubleshooting required status checks").
  # GitHub's auto-merge waits only for required checks, so they must run on every pull request (2026-11-27).
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run.
concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Mobile lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The root lint over apps/mobile only: the web and admin MCP's type-aware rules need their typegen,
      # which ci-cf.yml runs before its own Lint step.
      - name: Lint
        run: npm run lint -- apps/mobile
      - name: Format check
        run: npm run format:check -- apps/mobile
