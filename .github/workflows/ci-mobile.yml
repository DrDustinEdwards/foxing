name: CI (mobile)

# Lints and format-checks apps/mobile with the root Oxlint and Oxfmt configs (oxlint.config.ts, oxfmt.config.ts).
# Pull requests only: no deploy reads it, and the merge was checked as a pull request (devkit README, "No second run on
# main").
on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/client/**"
      - "packages/types/**"
      - "oxlint.config.ts"
      - "oxfmt.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-mobile.yml"

permissions:
  contents: read

# A newer push to a pull request cancels its older run.
concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The root lint over apps/mobile only: the web and admin MCP's type-aware rules need their typegen,
      # which ci-cf.yml runs before its own Lint step.
      - name: Lint
        run: npm run lint -- apps/mobile
      - name: Format check
        run: npm run format:check -- apps/mobile
