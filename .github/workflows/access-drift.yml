name: access-drift

# The daily Access drift check (area 3, I2), devkit's reusable workflow: the Access application in front
# of /admin must let in exactly the addresses on the Worker's ADMIN_EMAIL and CO_OWNER_EMAILS, which the site serves hashed at
# /admin/access-drift to the Access service token (workers/app.ts). No copy of the list is kept in GitHub.
# Until all four secrets are set the job fails, by design.

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    uses: DrDustinEdwards/devkit/.github/workflows/access-drift.yml@9e40afbad5fa778718b9aac65bc205b3c0a9c101 # v0.51.0
    with:
      app: foxing-login
      admins-url: https://foxing.app/admin/access-drift
      site-runtime-ref: v0.59.0
    secrets:
      ACCESS_READ_TOKEN: ${{ secrets.ACCESS_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
      ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
