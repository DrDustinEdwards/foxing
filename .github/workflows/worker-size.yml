name: worker-size

# The Worker bundle size budgets, apps/web/.worker-size.json for the web Worker and mcp/.worker-size.json for the admin
# MCP, checked by devkit's shared worker-size.yml against `wrangler deploy --dry-run` (the web build leaves
# .wrangler/deploy/config.json pointing the dry run at build/server/wrangler.json). No secret: the prepare step copies
# wrangler.jsonc.example and a dry run never talks to the account.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker-size-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  worker-size:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@64997ae3facf4360eb676c57b7a5b5e8ec3350de # v0.18.0
    with:
      package-manager: pnpm
      install: pnpm install --frozen-lockfile
      working-directory: apps/web
      prepare: cp apps/web/wrangler.jsonc.example apps/web/wrangler.jsonc && pnpm --filter web build

  # The admin MCP Worker in mcp/: its own npm package and lockfile, so its own install. devkit's bin comes from the
  # root install; the budget is mcp/.worker-size.json.
  mcp:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@64997ae3facf4360eb676c57b7a5b5e8ec3350de # v0.18.0
    with:
      package-manager: pnpm
      install: pnpm install --frozen-lockfile && npm ci --prefix mcp
      working-directory: mcp
      prepare: cp mcp/wrangler.jsonc.example mcp/wrangler.jsonc
