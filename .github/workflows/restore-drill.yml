name: restore-drill

# The weekly restore drill (devkit's restore-drill.yml): d1-dump restores the newest complete nightly
# dump from foxing-backups into a scratch SQLite file and checks it. The token reads that bucket only.

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    uses: DrDustinEdwards/devkit/.github/workflows/restore-drill.yml@96077f74b3e1a57e636b3653ec605c8c10e53a49 # v0.51.1
    with:
      bucket: foxing-backups
      d1-dump-ref: v0.16.1
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
