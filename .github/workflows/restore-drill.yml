name: restore-drill

# The weekly restore drill (devkit's restore-drill.yml): d1-dump restores the newest complete nightly
# dump from foxing-backups into a scratch SQLite file and checks it. The token reads that bucket only.

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    uses: DrDustinEdwards/devkit/.github/workflows/restore-drill.yml@19b78ba55081c1e032a87b71e6270aa8e64235ea # v0.66.0
    with:
      bucket: foxing-backups
      package-json: apps/web/package.json
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
