name: checks

# devkit's pull request checks in one job (pr.yml): the "Generated by Claude Code" footer removed from pull request
# descriptions, no AI trailer or author on new commits, the shared-code check, OSV-Scanner on what the change adds,
# actionlint and zizmor when .github/ changes, Knip and jscpd against .no-bloat.json, the bundle size of both Workers and
# the reviewer (advisory). Exceptions to the shared-code check are in .shared.json with their reasons, OSV-Scanner's in
# osv-scanner.toml, the workflow audit's in .github/actionlint.yaml and .github/zizmor.yml. What is shared:
# https://github.com/DrDustinEdwards/devkit/blob/shared-list/SHARED.md
# Run it by hand once to clean the footer from every past pull request.
#
# No push to main: the merge was checked as a pull request (devkit README, "No second run on main"). The deploys and the
# checks they need are in ci-cf.yml and ci-mcp.yml.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
  # Once a day on the default branch: the shared-code check judges the repository's state there, which a pull request's
  # run leaves to it (devkit pr.yml, "THE CALLER"). A red run is Capsid's job for this repository.
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The pull request is the group, so a newer push cancels the older run.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id makes the check "checks / Repo checks", the name main's ruleset requires.
  checks:
    # A called workflow holds no more than this job grants: the footer writes the description, the reviewer signs in to
    # Capsid with the job's OIDC token and writes its check.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: write
    uses: DrDustinEdwards/devkit/.github/workflows/pr.yml@90efbee8e78a1b07b334d5058d19cb0e2a9828d0 # v0.48.0
    with:
      review: true
      # The web build needs the lifecycle scripts, so the one install runs them; devkit-no-bloat runs Knip and jscpd
      # through npx at the versions in .no-bloat.json.
      install: npm ci
      # The budgets are apps/web/.worker-size.json and mcp/.worker-size.json. The web build leaves
      # .wrangler/deploy/config.json pointing the dry run at build/server/wrangler.json. The admin MCP in mcp/ has its own
      # package and lockfile, so its own install; devkit's bin comes from the root install. No secret: each prepare copies
      # wrangler.jsonc.example and a dry run never talks to the account.
      workers: >-
        [{ "name": "web", "working-directory": "apps/web",
           "prepare": "cp apps/web/wrangler.jsonc.example apps/web/wrangler.jsonc && npm run build -w web" },
         { "name": "mcp", "working-directory": "mcp",
           "prepare": "npm ci --prefix mcp && cp mcp/wrangler.jsonc.example mcp/wrangler.jsonc" }]
