name: CI (cf rebuild)

# Scoped to the Cloudflare workspaces (packages/core, packages/api, apps/web).
on:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "packages/api/**"
      - "packages/client/**"
      - "packages/types/**"
      - "apps/web/**"
      - ".github/workflows/ci-cf.yml"
      # Lint config and the lint:cf script decide what the Lint (biome) step checks.
      - "biome.json"
      - "package.json"
      # A lockfile change alone (a git dependency's pin) changes what is built and deployed.
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "packages/core/**"
      - "packages/api/**"
      - "packages/client/**"
      - "packages/types/**"
      - "apps/web/**"
      - ".github/workflows/ci-cf.yml"
      # Lint config and the lint:cf script decide what the Lint (biome) step checks.
      - "biome.json"
      - "package.json"
      # A lockfile change alone (a git dependency's pin) changes what is built and deployed.
      - "pnpm-lock.yaml"

jobs:
  check:
    runs-on: ubuntu-latest
    # Pinned by commit sha and time-limited (capsid residual 6, 2026-09-08).
    # A tag is a moving pointer its owner can repoint at any time, and a job with
    # no timeout-minutes inherits GitHub's 360-minute default. pnpm/action-setup's
    # v4 is an annotated tag; the sha pinned is the commit it dereferences to.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # wrangler.jsonc is gitignored; typegen + vitest-pool need a config present.
      # Placeholder IDs are fine for local D1 (miniflare) and typegen.
      - name: Stage wrangler config
        run: cp apps/web/wrangler.jsonc.example apps/web/wrangler.jsonc
      - name: Cloudflare typegen
        run: pnpm --filter web exec wrangler types
      - name: Typecheck core
        run: pnpm --filter @foxing/core exec tsc --noEmit
      - name: Typecheck api
        run: pnpm --filter @foxing/api exec tsc --noEmit
      - name: Typecheck client
        run: pnpm --filter @foxing/client exec tsc --noEmit
      - name: Typecheck web
        run: pnpm --filter web run type-check
      - name: Lint (biome)
        run: pnpm run lint:cf
      - name: Drizzle migration check
        run: pnpm --filter @foxing/core exec drizzle-kit check
      - name: Unit tests (core)
        run: pnpm --filter @foxing/core test
      - name: Integration tests (web, local D1)
        run: pnpm --filter web test

  # devkit's shared deploy (worker-deploy.yml): it records the D1 Time Travel bookmark, applies the D1
  # migrations and builds (pre-deploy), deploys with DEPLOY_SHA set to this commit, waits for /health to
  # report it, checks the home page answers, and rolls the deploy back if it does not. A rollback never
  # undoes a migration; the bookmark in the run's summary does. Dormant until CF_DEPLOY is 'true'.
  # The staged wrangler.jsonc carries the real IDs and BETTER_AUTH_URL, which the build bakes in.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_DEPLOY == 'true'
    concurrency:
      group: deploy
      cancel-in-progress: false
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@dfdb60397d24f15c80b9468059d7d601b2caa6bf # v0.20.1
    with:
      worker-name: foxing
      health-url: https://foxing.app/health
      verify-command: >-
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://foxing.app/ || true);
        echo "home page answered $code";
        if [ "$code" = 200 ]; then exit 0; elif [ "$code" = 000 ]; then exit 3; else exit 1; fi
      working-directory: apps/web
      install: npm install -g pnpm@11.1.2 && pnpm install --frozen-lockfile
      pre-deploy: >-
        sed -e "s|<D1_DATABASE_ID>|${{ vars.D1_DATABASE_ID }}|"
        -e "s|<KV_NAMESPACE_ID>|${{ vars.KV_NAMESPACE_ID }}|"
        -e "s|https://<your-worker>.workers.dev|${{ vars.BETTER_AUTH_URL }}|"
        wrangler.jsonc.example > wrangler.jsonc &&
        pnpm exec wrangler d1 migrations apply foxing --remote &&
        pnpm exec react-router build
      sha-var: DEPLOY_SHA
      d1-database: foxing
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  e2e:
    # Public catalog flows (browse, book page, misspelled-author fuzzy, WCAG AA) and
    # the signed-in flows (auth.setup.ts signs in through the real form, then the
    # authed project runs) both run against the just-deployed site, after its live gate, backed by the
    # real D1. The signed-in specs need the persistent e2e account (E2E_EMAIL, seeded once
    # via apps/web/scripts/seed-e2e-user.mjs) and its passkey (E2E_PASSKEY_PRIVATE_KEY, set
    # by apps/web/scripts/seed-e2e-passkeys.mjs).
    # Absent those, auth.setup.ts fails loudly rather than skipping the authed suite.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run E2E
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: ${{ vars.BETTER_AUTH_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSKEY_PRIVATE_KEY: ${{ secrets.E2E_PASSKEY_PRIVATE_KEY }}
          # The Plus account (club specs) and accounts B and C (social-reading gate),
          # seeded once via apps/web/scripts/seed-e2e-plus-user.mjs and seed-e2e-social.mjs.
          E2E_PLUS_EMAIL: ${{ secrets.E2E_PLUS_EMAIL }}
          E2E_B_EMAIL: ${{ secrets.E2E_B_EMAIL }}
          E2E_C_EMAIL: ${{ secrets.E2E_C_EMAIL }}
          # The ephemeral-account onboarding spec (e2e/onboarding-flow.spec.ts) shells
          # out to `wrangler d1 execute --remote` to write the fresh account and its passkey
          # it provisions per run, the same rows scripts/seed-e2e-user.mjs writes.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter web exec playwright test
      # Print the same error contexts into the log, which a session can read when the
      # artifact's storage host is out of its reach. The log is public, so a text box's
      # value (a test account's email or password typed into a form) is blanked.
      - name: Print e2e error context
        if: failure()
        working-directory: apps/web
        run: |
          find test-results -name error-context.md -print0 |
            xargs -0 -r -I{} sh -c 'echo "{}"; sed -E "s/^(\s*- textbox [^:]*): .*/\1: [redacted]/" "{}"' || true
      # Keep each failing test's error context (the page's accessibility snapshot at the
      # failure), so a failure against the live site can be read from the run. Only those
      # files: a trace records the e2e accounts' session cookies.
      - name: Upload e2e error context
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: apps/web/test-results/**/error-context.md
          retention-days: 7
