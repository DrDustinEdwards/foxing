name: Page weight (warn-only)

# JavaScript and CSS weight per route of apps/web (gzip), from a production build,
# compared with the baseline in .route-weight.json by devkit-route-weight. WARN-ONLY
# (capsid decisions, 2026-10-01, "no bloat, as a standing plan"): a route grown past
# the threshold is a warning and the step passes. It exits 1 only when it could not
# run (no build); the step is continue-on-error, so even that never blocks a merge.
#
# Separate from ci-cf.yml so it runs while that workflow's Lint (biome) step is
# red on main. The paths are what the web client bundle is built from: apps/web
# (minus its tests), the workspace packages it imports, and the lockfile.
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "packages/api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".route-weight.json"
      - ".github/workflows/page-weight.yml"
      - "!apps/web/test/**"
      - "!apps/web/e2e/**"
      - "!**/*.md"

# Capsomer is a git dependency built on install (its prepare script), and npm 12 refuses the git
# dependency in Capsomer's own devDependencies unless allow-git says so; "root" allows only that
# package's direct ones. pnpm hands the prepare step this variable. Each job also moves the pnpm
# store out of setup-pnpm's node_modules: the prepare build typechecks in the store's tmp folder,
# and under a node_modules path tsc calls Capsomer's React types not portable.
env:
  NPM_CONFIG_ALLOW_GIT: root

permissions:
  contents: read

concurrency:
  group: page-weight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Same pinned actions as ci-cf.yml.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm config set store-dir ~/.pnpm-store
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # wrangler.jsonc is gitignored; the Cloudflare Vite plugin needs a config
      # present to build. Placeholder ids are fine: nothing is deployed.
      - name: Stage wrangler config
        run: cp apps/web/wrangler.jsonc.example apps/web/wrangler.jsonc
      # continue-on-error here too: a broken build is ci-cf.yml's to report. The
      # report step then exits 1 (no build) and says so.
      - name: Build web
        id: build
        continue-on-error: true
        run: pnpm build:web
      - name: Page weight (warn-only)
        id: weight
        continue-on-error: true
        run: pnpm run check:page-weight
      - name: Outcome
        if: always()
        run: |
          echo "build step: ${{ steps.build.outcome }} (warn-only; the job continues)"
          echo "page-weight step: ${{ steps.weight.outcome }} (warn-only; the job continues)"
