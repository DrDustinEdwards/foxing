name: Page weight

# JavaScript and CSS weight per route of apps/web (gzip), from a production build,
# compared with the baseline in .route-weight.json by devkit-route-weight. A GATE
# (area 7, D5: every React app fails CI over its route budget): a route over
# budget_bytes, or grown past its baseline, fails the job, and so does a build
# that cannot run.
#
# Separate from ci-cf.yml so it runs while that workflow's Lint step is
# red on main.
on:
  # Every pull request, with no paths filter: these jobs are required checks, and a required check whose workflow a
  # paths filter skips stays Pending and blocks the merge (GitHub Docs, "Troubleshooting required status checks").
  # GitHub's auto-merge waits only for required checks, so they must run on every pull request (2026-11-27).
  pull_request:

permissions:
  contents: read

concurrency:
  group: page-weight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Page weight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Same pinned actions as ci-cf.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # wrangler.jsonc is gitignored; the Cloudflare Vite plugin needs a config
      # present to build. Placeholder ids are fine: nothing is deployed.
      - name: Stage wrangler config
        run: cp apps/web/wrangler.jsonc.example apps/web/wrangler.jsonc
      - name: Build web
        run: npm run build:web
      - name: Page weight
        run: npm run check:page-weight
