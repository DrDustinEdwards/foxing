name: Page weight

# JavaScript and CSS weight per route of apps/web (gzip), from a production build,
# compared with the baseline in .route-weight.json by devkit-route-weight. A GATE
# (area 7, D5: every React app fails CI over its route budget): a route over
# budget_bytes, or grown past its baseline, fails the job, and so does a build
# that cannot run.
#
# Separate from ci-cf.yml so it runs while that workflow's Lint step is
# red on main. The paths are what the web client bundle is built from: apps/web
# (minus its tests), the workspace packages it imports, and the lockfile.
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "packages/api/**"
      - "package.json"
      - "package-lock.json"
      - ".route-weight.json"
      - ".github/workflows/page-weight.yml"
      - "!apps/web/test/**"
      - "!apps/web/e2e/**"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: page-weight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Same pinned actions as ci-cf.yml.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # wrangler.jsonc is gitignored; the Cloudflare Vite plugin needs a config
      # present to build. Placeholder ids are fine: nothing is deployed.
      - name: Stage wrangler config
        run: cp apps/web/wrangler.jsonc.example apps/web/wrangler.jsonc
      - name: Build web
        run: npm run build:web
      - name: Page weight
        run: npm run check:page-weight
