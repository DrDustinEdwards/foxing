name: android-proof
# Temporary: proves the npm move still builds the Android app. Removed before merge.
on:
  pull_request:
    paths:
      - ".github/workflows/android-proof.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      # Install CMake and the NDK once, up front: Gradle's parallel native tasks otherwise race to install them.
      - run: echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "ndk;27.1.12297006" "ndk;27.0.12077973" > /dev/null
      - run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --info --max-workers=2 -PreactNativeArchitectures=arm64-v8a 2>&1 | tee /tmp/gradle.log | grep -v '^\s*$' | tail -n 5 || { grep -n -B3 -A25 'CMake Error\|ninja: error\|fatal error\|Caused by' /tmp/gradle.log | head -150; exit 1; }
        working-directory: apps/mobile/android
