name: tmp reader diag
on:
  push:
    branches: [claude/project-thread-fbi6hl]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec -w web -- playwright install --with-deps chromium
      - name: Diag
        env:
          PLAYWRIGHT_BASE_URL: https://foxing.app
        run: node apps/web/e2e/tmp-diag.mjs
      - name: Public project, trace on
        continue-on-error: true
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: https://foxing.app
        run: npm exec -w web -- playwright test --project=public --trace on
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: traces
          path: apps/web/test-results/**
          retention-days: 3
