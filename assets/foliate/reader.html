<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Foxing Reader</title>
  <style>
    /* The body is the canvas; foliate-view fills it. We let the host
       (React Native) override background/color via applyTheme(). */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #1a1a1a;
      color: #ffffff;
      font-family: -apple-system, system-ui, sans-serif;
    }
    foliate-view {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Loading splash — replaced when the book opens. */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div id="loading">Preparing reader…</div>

  <script type="module">
    // The bridge speaks JSON over window.ReactNativeWebView.postMessage.
    // Inbound calls are dispatched via window.foliateBridge.* (set up below)
    // which the RN host invokes via injectJavaScript.
    const post = (msg) => {
      try {
        window.ReactNativeWebView?.postMessage(JSON.stringify(msg))
      } catch (e) {
        // Older WebView versions occasionally throw on bigger payloads;
        // keep going so a single bad message doesn't kill the bridge.
        console.error('postMessage failed:', e)
      }
    }

    // Surface uncaught errors so the host can show them rather than
    // leaving the user looking at a blank canvas.
    window.addEventListener('error', (e) => {
      post({ type: 'error', message: e.message || 'unknown script error' })
    })
    window.addEventListener('unhandledrejection', (e) => {
      const m = e.reason?.message || String(e.reason || 'unhandled rejection')
      post({ type: 'error', message: m })
    })

    // Load the foliate-view web component. view.js itself dynamically
    // imports vendor/zip.js, paginator.js, fixed-layout.js, epub.js, etc.
    // — so all those siblings must already be on disk in this directory.
    await import('./view.js')

    let view = null
    let lastSelectionCfi = null

    // Convert base64 → Blob without going through atob+charCodeAt for the
    // whole string (which would peak at 3x memory). Process in chunks.
    function base64ToBlob(b64, mimeType) {
      const byteChars = atob(b64)
      const bytes = new Uint8Array(byteChars.length)
      for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i)
      return new Blob([bytes], { type: mimeType })
    }

    // Single-word vs passage routing. Same regex shape as the old reader.
    const WORD_RE = /^[\p{L}\p{N}'-]{2,}$/u

    // Foliate's renderer mounts each chapter inside an iframe. The 'load'
    // event fires when a new section becomes visible; that's where we
    // attach selection + tap listeners on the inner doc.
    function wireDocumentEvents(doc) {
      // Tap detection: a click with no active text selection. We fire
      // before letting foliate handle the click for nav, so the host
      // can toggle chrome on every tap without breaking page-turn taps.
      doc.addEventListener('click', (e) => {
        const sel = doc.getSelection?.()
        if (sel && !sel.isCollapsed && sel.toString().trim()) return
        // Don't toggle chrome on link taps — foliate handles those.
        if (e.target.closest && e.target.closest('a[href]')) return
        post({ type: 'tap' })
      }, true)

      // Selection: fire on selectionchange but debounce so we only emit
      // the final state after the user lifts the finger.
      let selTimer = null
      const onSelChange = () => {
        if (selTimer) clearTimeout(selTimer)
        selTimer = setTimeout(() => {
          const sel = doc.getSelection?.()
          if (!sel || sel.isCollapsed) return
          const text = sel.toString().trim()
          if (!text) return
          let cfi = null
          try {
            const range = sel.getRangeAt(0)
            cfi = view?.getCFI?.(currentIndex(), range) ?? null
          } catch {}
          lastSelectionCfi = cfi
          if (WORD_RE.test(text)) {
            post({ type: 'wordSelected', word: text, cfi })
          } else {
            post({ type: 'passageSelected', text, cfi })
          }
        }, 250)
      }
      doc.addEventListener('selectionchange', onSelChange)
      doc.addEventListener('mouseup', onSelChange)
      doc.addEventListener('touchend', onSelChange)
    }

    let _currentIndex = 0
    function currentIndex() { return _currentIndex }

    async function openBookFromBase64(base64, mime = 'application/epub+zip') {
      const blob = base64ToBlob(base64, mime)
      const file = new File([blob], 'book.epub', { type: mime })

      // foliate-view is registered globally by view.js's import side effect.
      view = document.createElement('foliate-view')
      document.body.append(view)

      // Wire events BEFORE open() so we don't miss the first 'load'.
      view.addEventListener('load', (e) => {
        const { doc, index } = e.detail
        _currentIndex = index
        wireDocumentEvents(doc)
      })
      view.addEventListener('relocate', (e) => {
        const { fraction, cfi, tocItem } = e.detail
        post({
          type: 'locationChange',
          cfi: cfi ?? null,
          fraction: typeof fraction === 'number' ? fraction : 0,
          tocLabel: tocItem?.label || null,
        })
      })

      try {
        await view.open(file)
      } catch (e) {
        post({ type: 'error', message: e?.message || 'open failed' })
        return
      }

      const splash = document.getElementById('loading')
      if (splash) splash.remove()

      // Apply any pending theme (queued before openBook resolves).
      if (pendingTheme) {
        applyThemeNow(pendingTheme)
        pendingTheme = null
      }

      // Render the first page.
      view.renderer.next()

      const meta = view.book?.metadata ?? {}
      post({
        type: 'opened',
        metadata: {
          title: typeof meta.title === 'string' ? meta.title : null,
          author: Array.isArray(meta.author)
            ? meta.author.map((a) => typeof a === 'string' ? a : a?.name).filter(Boolean).join(', ')
            : (typeof meta.author === 'string' ? meta.author : null),
        },
      })
    }

    let pendingTheme = null
    function applyThemeNow(theme) {
      const { background, text, fontSize, lineHeight } = theme
      // Body background is the gutter color visible in the side margins.
      document.body.style.background = background
      document.body.style.color = text
      // The CSS injected into each loaded section's iframe.
      const css = `
        @namespace epub "http://www.idpf.org/2007/ops";
        html { color-scheme: ${background.match(/#?[0-9a-f]{3,8}/i) && parseInt(background.replace('#',''), 16) < 0x808080 ? 'dark' : 'light'}; }
        body {
          background: ${background} !important;
          color: ${text} !important;
          font-size: ${fontSize}px !important;
          line-height: ${lineHeight} !important;
          padding: 16px !important;
        }
        p, li, blockquote, dd, span, div { color: ${text} !important; }
        a:link { color: lightblue; }
        pre { white-space: pre-wrap !important; }
        aside[epub|type~="endnote"],
        aside[epub|type~="footnote"],
        aside[epub|type~="note"],
        aside[epub|type~="rearnote"] { display: none; }
      `
      view?.renderer?.setStyles?.(css)
    }

    function applyTheme(theme) {
      if (!view) {
        pendingTheme = theme
        return
      }
      applyThemeNow(theme)
    }

    async function goToCfi(cfi) {
      if (!view || !cfi) return
      try { await view.goTo(cfi) } catch (e) {
        post({ type: 'error', message: 'goTo failed: ' + (e?.message || 'unknown') })
      }
    }

    function goNext() { view?.renderer?.next() }
    function goPrev() { view?.renderer?.prev() }

    // Public bridge — the RN host injects calls like
    // `window.foliateBridge.openBookFromBase64('AAA...')` via injectJavaScript.
    window.foliateBridge = {
      openBookFromBase64,
      applyTheme,
      goToCfi,
      goNext,
      goPrev,
    }

    post({ type: 'ready' })
  </script>
</body>
</html>
