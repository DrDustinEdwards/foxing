packages:
  - 'apps/*'
  - 'packages/*'
# Readium pulls @edrlab/thorium-locales via a git URL from @readium/shared.
# That subdep is legitimate, so allow exotic sub-deps for the workspace.
blockExoticSubdeps: false
allowBuilds:
  '@sentry/cli': true
  dtrace-provider: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
# patch-package doesn't play nicely with pnpm symlinks on Windows
# (Cannot read properties of undefined (reading 'dependencies') at
# getPackageResolution). Use pnpm's native patchedDependencies instead.
# The patch file lives at patches/<name>@<version>.patch and is applied
# on every pnpm install.
patchedDependencies:
  react-native-readium@5.0.0-rc.17: patches/react-native-readium@5.0.0-rc.17.patch
