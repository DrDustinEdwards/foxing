packages:
  - 'apps/*'
  - 'packages/*'
# Readium pulls @edrlab/thorium-locales via a git URL from @readium/shared.
# That subdep is legitimate, so allow exotic sub-deps for the workspace.
blockExoticSubdeps: false
allowBuilds:
  '@sentry/cli': set this to true or false
  dtrace-provider: set this to true or false
  esbuild: set this to true or false
  msgpackr-extract: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
